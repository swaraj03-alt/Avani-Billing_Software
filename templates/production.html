{% extends "base.html" %}
{% block title %}Production Batch{% endblock %}

{% block content %}
<style>
.card {
    background:white;
    padding:28px;
    border-radius:16px;
    max-width:900px;
    margin:auto;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
.full { grid-column:span 2; }
label { font-weight:600; font-size:0.85rem; }
input, select {
    padding:12px;
    border-radius:8px;
    border:1.5px solid #e2e8f0;
    width:100%;
}
button {
    background:#16a34a;
    color:white;
    border:none;
    padding:14px;
    border-radius:10px;
    font-weight:700;
    width:100%;
}
</style>

<div class="card">
<h2>🏭 Production Batch Entry</h2>

<form method="POST" action="/save-production-batch">
<div class="grid">

<!-- PRODUCT SELECT -->
<div>
<label>Product Type</label>
<select name="oil_type" id="productSelect" required onchange="toggleNewProduct(this)">
    <option value="">-- Select Product --</option>

    <optgroup label="🫒 Edible Oils">
        <option>Groundnut Oil</option>
        <option>Sunflower Oil</option>
        <option>Sesame Oil</option>
        <option>Mustard Oil</option>
        <option>Coconut Oil</option>
        <option>Virgin Coconut Oil</option>
        <option>Olive Oil</option>
    </optgroup>

    <optgroup label="🧈 Ghee">
        <option>Cow Ghee</option>
        <option>Buffalo Ghee</option>
    </optgroup>

    <optgroup label="🌿 Essential Oils">
        <option>Lavender Oil</option>
        <option>Tea Tree Oil</option>
        <option>Rose Oil</option>
        <option>Jojoba Oil</option>
        <option>Argan Oil</option>
        <option>Basil Oil</option>
    </optgroup>

    <optgroup label="🌶 Organic Spices & Foods">
        <option>Chilli Powder</option>
        <option>Turmeric Powder</option>
        <option>Pink Salt</option>
        <option>Organic Honey</option>
    </optgroup>

    <optgroup label="➕ Custom">
        <option value="__new__">➕ Add New Product</option>
    </optgroup>
</select>

<input type="text" name="new_product" id="newProductInput"
       placeholder="Enter new product name"
       style="display:none;margin-top:10px;">
</div>

<div>
<label>Raw Material</label>
<input name="raw_material" placeholder="Eg: Groundnut Seeds">
</div>

<div>
<label>Raw Quantity (kg)</label>
<input name="raw_qty" type="number" step="0.01" required>
</div>

<div>
<label>Oil Extracted (litres)</label>
<input name="oil_extracted" type="number" step="0.01" required>
</div>

<div>
<label>Oil Cake (kg)</label>
<input name="oil_cake" type="number" step="0.01">
</div>

<div>
<label>Wastage (kg)</label>
<input name="wastage" type="number" step="0.01">
</div>

<div>
<label>Container</label>
<select name="container_code" required>
    <option value="">Select Container</option>
    <option>01</option>
    <option>02</option>
    <option>03</option>
    <option>04</option>
    <option>05</option>
    <option>06</option>
    <option>07</option>
    <option>08</option>
    <option>09</option>
    <option>10</option>
</select>
</div>

<div>
<label>Machine</label>
<input name="machine" placeholder="Cold Press Machine" readonly>
</div>

<div>
<label>Operator</label>
<input name="operator">
</div>

<div class="full">
<button>Save Production Batch</button>
</div>

</div>
</form>
</div>

<script>
function toggleNewProduct(select){
    const input = document.getElementById("newProductInput");
    if(select.value === "__new__"){
        input.style.display = "block";
        input.required = true;
    } else {
        input.style.display = "none";
        input.required = false;
    }
}
</script>

{% endblock %}
