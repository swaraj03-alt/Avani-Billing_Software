{% extends "base.html" %}
{% block title %}Purchase Entry{% endblock %}

{% block content %}
<style>
/* ================= PURCHASE ENTRY ================= */

.purchase-container {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 30px;
    align-items: start;
}

/* RESPONSIVE */
@media (max-width: 992px) {
    .purchase-container {
        grid-template-columns: 1fr;
    }
}

/* COMMON CARDS */
.entry-card,
.purchase-preview {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* LEFT CARD */
.entry-card h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.4rem;
}

/* FORM GRID */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full-width {
    grid-column: span 2;
}

@media (max-width: 576px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    .full-width {
        grid-column: span 1;
    }
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.input-group label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #475569;
}

input, select {
    padding: 11px 12px;
    border-radius: 8px;
    border: 1.5px solid #e2e8f0;
    font-size: 0.95rem;
}

input:focus, select:focus {
    border-color: var(--brand-green);
    outline: none;
}

/* ADD BUTTON */
.btn-add {
    grid-column: span 2;
    background: var(--brand-green);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

/* RIGHT PREVIEW */
.preview-header {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 2px dashed #e2e8f0;
}

.preview-header h3 {
    margin: 0;
    font-size: 1.1rem;
}

.preview-header small {
    color: #64748b;
}

/* TABLE */
.preview-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.preview-table th {
    padding: 10px 14px;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #64748b;
    border-bottom: 1px solid #f1f5f9;
}

.preview-table td {
    padding: 10px 14px;
    font-size: 0.9rem;
    border-bottom: 1px solid #f1f5f9;
}

/* TOTAL */
.total-section {
    margin-top: auto;
    padding-top: 18px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    font-size: 1.15rem;
}

/* SAVE BUTTON */
.btn-save {
    width: 100%;
    background: #4f46e5;
    color: white;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    margin-top: 12px;
    cursor: pointer;
}
</style>

<form method="POST" action="/save-purchase">
<div class="purchase-container">

<!-- ================= LEFT : PURCHASE ENTRY ================= -->
<div class="entry-card">
<h2>Create Purchase Entry</h2>

<div class="form-grid">

<!-- Vendor -->
<div class="input-group full-width">
<label>Vendor Name</label>
<input name="vendor_name" id="vendorInput" autocomplete="off" required>
<div id="vendorSuggestions"
     style="display:none;position:absolute;background:white;border:1px solid #e5e7eb;
            border-radius:8px;margin-top:4px;width:100%;z-index:999;">
</div>
</div>

<!-- Bill Date -->
<div class="input-group">
<label>Bill Date</label>
<input type="date" name="bill_date" required>
</div>

<!-- Payment Mode -->
<div class="input-group">
<label>Payment Mode</label>
<select name="payment_mode" id="paymentMode" required>
<option value="CASH">Cash</option>
<option value="UPI">UPI</option>
<option value="BANK">Bank Transfer</option>
<option value="CREDIT">Credit (Pay Later)</option>
</select>
</div>

 <!-- 🔽 UPI INFO (RECORD ONLY) -->
<div id="upiSection" class="input-group full-width" style="display:none;">
    <label>UPI Reference (Optional)</label>
    <input name="upi_ref"
           placeholder="Transaction ID / Ref No (optional)">
    <small style="color:#64748b;">
        Used only for record. Payment is done outside the system.
    </small>
</div>


<!-- 🔽 BANK SECTION (ADDED – INLINE, SAME CARD) -->
<div id="bankSection" class="input-group full-width" style="display:none;">
<label>Select Bank Account</label>

<select name="bank_account_id" id="bankSelect">
<option value="">-- Select Bank --</option>
{% for b in banks %}
<option value="{{ b.id }}">
{{ b.bank_name }} | {{ b.account_no[-4:] }} | {{ b.account_name }}
</option>
{% endfor %}
</select>

<button type="button"
        onclick="toggleAddBank()"
        style="margin-top:6px;background:#e5e7eb;border:none;
               padding:8px;border-radius:8px;cursor:pointer;">
➕ Add New Bank
</button>

<div id="addBankForm" style="display:none;margin-top:10px;">
<input id="bankName" placeholder="Bank Name">
<input id="accountName" placeholder="Account Name">
<input id="accountNo" placeholder="Account Number">
<input id="ifsc" placeholder="IFSC">
<input id="branch" placeholder="Branch">

<button type="button"
        onclick="saveBank()"
        style="margin-top:6px;background:#4f46e5;color:white;
               padding:10px;border:none;border-radius:8px;">
Save Bank
</button>
</div>
</div>

<!-- Product -->
<div class="input-group full-width">
<label>Product / Raw Material</label>
<input id="prodName">
</div>

<div class="input-group">
<label>Purchase Price (₹)</label>
<input type="number" id="prodCost">
</div>

<div class="input-group">
<label>Selling Price (₹)</label>
<input type="number" id="prodSell" step="0.01">
</div>

<div class="input-group full-width">
<label><input type="checkbox" id="addToSale"> Add this item to Sale Stock</label>
</div>

<div class="input-group">
<label>Quantity</label>
<input type="number" id="prodQty" value="1" min="0.01" step="0.01">
</div>

<div class="input-group">
<label>Unit</label>
<select id="prodUnit">
<option value="KG">KG</option>
<option value="GM">GM</option>
<option value="LITRE">LITRE</option>
<option value="ML">ML</option>
<option value="BOTTLE">BOTTLE</option>
<option value="TIN">TIN</option>
<option value="BAG">BAG</option>
<option value="BOX">BOX</option>
</select>
</div>

<button type="button" class="btn-add" onclick="addItem()">+ Add Item</button>
</div>
</div>

<!-- ================= RIGHT : PREVIEW ================= -->
<div class="purchase-preview">
<div class="preview-header">
<h3>Purchase Preview</h3>
<small>Live Cost Summary</small>
</div>

<table class="preview-table">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>
<tbody id="itemsBody"></tbody>
</table>

<input type="hidden" name="items_json" id="itemsJson">
<input type="hidden" name="total_amount" id="totalAmount">

<div class="total-section">
<div class="total-row">
<span>Total Cost</span>
<span id="totalText">₹ 0.00</span>
</div>
<button class="btn-save" type="submit">Save Purchase</button>
</div>
</div>

</div>
</form>

<script>
/* ================= YOUR ORIGINAL JS (UNCHANGED) ================= */
let total = 0;
let items = [];

const prodName = document.getElementById("prodName");
const prodCost = document.getElementById("prodCost");
const prodSell = document.getElementById("prodSell");
const prodQty = document.getElementById("prodQty");
const prodUnit = document.getElementById("prodUnit");
const itemsBody = document.getElementById("itemsBody");
const itemsJson = document.getElementById("itemsJson");
const totalAmount = document.getElementById("totalAmount");
const totalText = document.getElementById("totalText");
const addToSaleChk = document.getElementById("addToSale");

function addItem() {
    const name = prodName.value.trim();
    const cost = parseFloat(prodCost.value);
    const sell = parseFloat(prodSell.value) || 0;
    const qty = parseFloat(prodQty.value);
    const unit = prodUnit.value;
    const addToSale = addToSaleChk.checked;

    if (!name || !cost || !qty) {
        alert("Enter item name, cost and quantity");
        return;
    }

    if (addToSale && sell <= 0) {
        alert("Enter selling price if adding to sale stock");
        return;
    }

    const itemTotal = cost * qty;
    total += itemTotal;

    items.push({
        item: name,
        qty: qty,
        unit: unit,
        cost: cost,
        sell: sell,
        add_to_sale: addToSale,
        total: itemTotal
    });

    itemsBody.innerHTML += `
        <tr>
            <td>${name}${addToSale ? " 🛒" : ""}</td>
            <td>${qty} ${unit}</td>
            <td>₹ ${itemTotal.toFixed(2)}</td>
        </tr>
    `;

    totalText.innerText = `₹ ${total.toFixed(2)}`;
    itemsJson.value = JSON.stringify(items);
    totalAmount.value = total.toFixed(2);

    prodName.value = "";
    prodCost.value = "";
    prodSell.value = "";
    prodQty.value = 1;
    prodUnit.value = "KG";
    addToSaleChk.checked = false;
}

/* Vendor autocomplete */
const vendorInput = document.getElementById("vendorInput");
const suggestionBox = document.getElementById("vendorSuggestions");

vendorInput.addEventListener("input", async function () {
    const q = this.value.trim();
    if (q.length < 1) { suggestionBox.style.display = "none"; return; }

    const res = await fetch(`/api/vendors?q=${q}`);
    const vendors = await res.json();

    suggestionBox.innerHTML = "";
    vendors.forEach(v => {
        const div = document.createElement("div");
        div.innerText = v;
        div.style.padding = "8px 12px";
        div.onclick = () => {
            vendorInput.value = v;
            suggestionBox.style.display = "none";
        };
        suggestionBox.appendChild(div);
    });

    suggestionBox.style.display = "block";
});

/* ================= ADDED PAYMENT UI LOGIC ================= */
const paymentMode = document.getElementById("paymentMode");
const upiSection = document.getElementById("upiSection");
const bankSection = document.getElementById("bankSection");

paymentMode.addEventListener("change", function () {
    upiSection.style.display = this.value === "UPI" ? "block" : "none";
    bankSection.style.display = this.value === "BANK" ? "block" : "none";
});

/* Add bank */
function toggleAddBank() {
    const f = document.getElementById("addBankForm");
    f.style.display = f.style.display === "none" ? "block" : "none";
}

async function saveBank() {
    const data = {
        bank_name: bankName.value,
        account_name: accountName.value,
        account_no: accountNo.value,
        ifsc: ifsc.value,
        branch: branch.value
    };

    const res = await fetch("/api/save-bank", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    });

    const r = await res.json();
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.label;
    opt.selected = true;
    bankSelect.appendChild(opt);
    document.getElementById("addBankForm").style.display = "none";
}
</script>

{% endblock %}
