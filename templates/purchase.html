{% extends "base.html" %}
{% block title %}Purchase Entry{% endblock %}

{% block content %}
<style>
/* ================= PURCHASE ENTRY ================= */

.purchase-container {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 30px;
    align-items: start;
}

/* RESPONSIVE */
@media (max-width: 992px) {
    .purchase-container {
        grid-template-columns: 1fr;
    }
}

/* COMMON CARDS */
.entry-card,
.purchase-preview {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* LEFT CARD */
.entry-card h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.4rem;
}

/* FORM GRID */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full-width {
    grid-column: span 2;
}

@media (max-width: 576px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    .full-width {
        grid-column: span 1;
    }
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.input-group label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #475569;
}

input {
    padding: 11px 12px;
    border-radius: 8px;
    border: 1.5px solid #e2e8f0;
    font-size: 0.95rem;
}

input:focus {
    border-color: var(--brand-green);
    outline: none;
}

/* ADD BUTTON */
.btn-add {
    grid-column: span 2;
    background: var(--brand-green);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
}

@media (max-width: 576px) {
    .btn-add {
        grid-column: span 1;
    }
}

/* RIGHT PREVIEW */
.preview-header {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 2px dashed #e2e8f0;
}

.preview-header h3 {
    margin: 0;
    font-size: 1.1rem;
}

.preview-header small {
    color: #64748b;
}

/* TABLE */
.preview-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.preview-table th {
    padding: 10px 14px;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #64748b;
    border-bottom: 1px solid #f1f5f9;
}

.preview-table td {
    padding: 10px 14px;
    font-size: 0.9rem;
    border-bottom: 1px solid #f1f5f9;
}

/* TOTAL */
.total-section {
    margin-top: auto;
    padding-top: 18px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    font-size: 1.15rem;
}

/* SAVE BUTTON */
.btn-save {
    width: 100%;
    background: #4f46e5;
    color: white;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    margin-top: 12px;
    cursor: pointer;
}
</style>

<form method="POST" action="/save-purchase">
<div class="purchase-container">

    <!-- LEFT : PURCHASE ENTRY -->
    <div class="entry-card">
        <h2>Create Purchase Entry</h2>

        <div class="form-grid">
            <div class="input-group full-width">
                <label>Vendor Name</label>
                <input name="vendor_name" required>
            </div>

            <div class="input-group">
                <label>Bill Number</label>
                <input name="bill_no">
            </div>

            <div class="input-group">
                <label>Bill Date</label>
                <input type="date" name="bill_date" required>
            </div>

            <div class="input-group full-width">
                <label>Product / Raw Material</label>
                <input id="prodName">
            </div>

            <div class="input-group">
                <label>Cost Price (₹)</label>
                <input type="number" id="prodCost">
            </div>

            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="prodQty" value="1">
            </div>

            <button type="button" class="btn-add" onclick="addItem()">+ Add Item</button>
        </div>
    </div>

    <!-- RIGHT : PREVIEW -->
    <div class="purchase-preview">
        <div class="preview-header">
            <h3>Purchase Preview</h3>
            <small>Live Cost Summary</small>
        </div>

        <table class="preview-table">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>

        <!-- HIDDEN INPUTS -->
        <input type="hidden" name="items_json" id="itemsJson">
        <input type="hidden" name="total_amount" id="totalAmount">

        <div class="total-section">
            <div class="total-row">
                <span>Total Cost</span>
                <span id="totalText">₹ 0.00</span>
            </div>
            <button class="btn-save" type="submit">Save Purchase</button>
        </div>
    </div>

</div>
</form>

<script>
let total = 0;
let items = [];

function addItem() {
    const name = prodName.value;
    const cost = +prodCost.value;
    const qty = +prodQty.value;

    if (!name || !cost) {
        alert("Enter item details");
        return;
    }

    const itemTotal = cost * qty;
    total += itemTotal;

    items.push({ item: name, qty, cost, total: itemTotal });

    itemsBody.innerHTML += `
        <tr>
            <td>${name}</td>
            <td>${qty}</td>
            <td>₹ ${itemTotal.toFixed(2)}</td>
        </tr>
    `;

    totalText.innerText = `₹ ${total.toFixed(2)}`;
    itemsJson.value = JSON.stringify(items);
    totalAmount.value = total.toFixed(2);

    prodName.value = "";
    prodCost.value = "";
    prodQty.value = 1;
    prodName.focus();
}
</script>

{% endblock %}
