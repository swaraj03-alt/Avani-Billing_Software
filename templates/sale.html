{% extends "base.html" %}
{% block title %}Sale / Billing{% endblock %}

{% block content %}
<style>
/* ================= SALE BILLING ================= */

.billing-container {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 30px;
    align-items: start;
}

/* RESPONSIVE */
@media (max-width: 992px) {
    .billing-container {
        grid-template-columns: 1fr;
    }
}

/* ENTRY FORM */
.entry-card {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.entry-card h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.4rem;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full-width {
    grid-column: span 2;
}

@media (max-width: 576px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
    .full-width {
        grid-column: span 1;
    }
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.input-group label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #475569;
}

input {
    padding: 11px 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.95rem;
}

input:focus {
    border-color: var(--brand-green);
    outline: none;
}

.btn-add {
    grid-column: span 2;
    background: var(--brand-green);
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}

@media (max-width: 576px) {
    .btn-add {
        grid-column: span 1;
    }
}

/* ================= LIVE PREVIEW ================= */

.invoice-preview {
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    min-height: 480px;
}

.invoice-header {
    padding: 18px;
    border-bottom: 2px dashed #e2e8f0;
    text-align: center;
}

.invoice-header h3 {
    margin: 0;
    font-size: 1.1rem;
}

.invoice-header small {
    color: #64748b;
}

/* TABLE */
.bill-table {
    width: 100%;
    border-collapse: collapse;
}

.bill-table th {
    padding: 10px 14px;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #64748b;
    border-bottom: 1px solid #f1f5f9;
}

.bill-table td {
    padding: 10px 14px;
    font-size: 0.9rem;
    border-bottom: 1px solid #f1f5f9;
}

/* TOTAL */
.total-section {
    margin-top: auto;
    padding: 18px;
    background: #f8fafc;
    border-radius: 0 0 16px 16px;
}

.total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 800;
    font-size: 1.15rem;
}

.btn-generate {
    width: 100%;
    margin-top: 12px;
    background: #4f46e5;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}
</style>

<div class="billing-container">

    <!-- LEFT : ENTRY -->
    <div class="entry-card">
        <h2>Create New Bill</h2>

        <div class="form-grid">
            <div class="input-group full-width">
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="Search or enter name">
            </div>

            <div class="input-group full-width">
                <label>Scan Product / Search Code</label>
                <input type="text" id="prodName" placeholder="Barcode Scanner Input">
            </div>

            <div class="input-group">
                <label>Price (₹)</label>
                <input type="number" id="prodPrice" placeholder="0.00">
            </div>

            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="prodQty" value="1">
            </div>

            <button class="btn-add" onclick="addItem()">+ Add to Bill</button>
        </div>
    </div>

    <!-- RIGHT : PREVIEW -->
    <div class="invoice-preview">
        <div class="invoice-header">
            <h3>Avani Wood Pressed Oil</h3>
            <small>Live Bill Preview</small>
        </div>

        <table class="bill-table" id="billItems">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total-section">
            <div class="total-row">
                <span>Grand Total</span>
                <span id="grandTotal">₹ 0.00</span>
            </div>
            <button class="btn-generate" onclick="openPaymentModal()">
                Proceed to Payment
            </button>
        </div>
    </div>

</div>

<script>
let total = 0;

function addItem() {
    const name = prodName.value;
    const price = parseFloat(prodPrice.value);
    const qty = parseInt(prodQty.value);

    if (!name || !price) {
        alert("Please fill product details");
        return;
    }

    const subtotal = price * qty;
    total += subtotal;

    const row = billItems.querySelector("tbody").insertRow();
    row.innerHTML = `
        <td>${name}</td>
        <td>${qty}</td>
        <td>₹ ${subtotal.toFixed(2)}</td>
    `;

    grandTotal.innerText = `₹ ${total.toFixed(2)}`;

    prodName.value = "";
    prodPrice.value = "";
    prodQty.value = "1";
    prodName.focus();
}

function openPaymentModal() {
    const customer = custName.value;

    if (total <= 0) return alert("Please add at least one product.");
    if (!customer) return alert("Please enter Customer Name.");

    window.location.href = `/payments?customer=${encodeURIComponent(customer)}&total=${total.toFixed(2)}`;
}
</script>

{% endblock %}
