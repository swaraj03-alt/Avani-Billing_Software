{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}

<h4 class="fw-bold mb-4">Customers</h4>

<div class="card shadow-sm">
    <div class="card-body">

        <div class="d-flex justify-content-between mb-3">
            <input class="form-control w-25" placeholder="Search customer">
            <a href="/customers/add" class="btn btn-success">+ Add Customer</a>
        </div>

        <table class="table table-bordered align-middle">
            <thead class="table-light">
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>GSTIN</th>
                    <th>Outstanding</th>
                    <th width="120">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Walk-in Customer</td>
                    <td>—</td>
                    <td>—</td>
                    <td class="text-success">₹0.00</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary">View</a>
                        <a class="btn btn-sm btn-outline-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

{% endblock %}
