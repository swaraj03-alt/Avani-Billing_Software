{% extends "base.html" %}
{% block title %}Invoices{% endblock %}
{% block content %}

<h4 class="fw-bold mb-4">Sales Invoices</h4>

<div class="card shadow-sm">
<div class="card-body">

<div class="d-flex justify-content-between mb-3">
    <input class="form-control w-25" placeholder="Search invoice">
    <a href="/sale" class="btn btn-success">+ New Invoice</a>
</div>

<table class="table table-bordered align-middle">
<thead class="table-light">
<tr>
    <th>Invoice No</th>
    <th>Date</th>
    <th>Customer</th>
    <th>Amount</th>
    <th>Status</th>
    <th width="150">Actions</th>
</tr>
</thead>
<tbody>
<tr>
    <td>INV/25-26/001</td>
    <td>01-Apr-2025</td>
    <td>Retail Client</td>
    <td>₹14,160</td>
    <td><span class="badge bg-success">Paid</span></td>
    <td>
        <a class="btn btn-sm btn-outline-primary">View</a>
        <a class="btn btn-sm btn-outline-secondary">PDF</a>
        <a class="btn btn-sm btn-outline-success">WhatsApp</a>
    </td>
</tr>
</tbody>
</table>

</div>
</div>

{% endblock %}
