{% extends "base.html" %}
{% block title %}Receive Payment{% endblock %}

{% block content %}
<style>
.payment-wrapper {
    max-width: 950px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 25px;
}
@media (max-width: 992px) {
    .payment-wrapper { grid-template-columns: 1fr; }
}
.card {
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
.payment-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}
.pay-btn {
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
}
.pay-btn.active {
    border-color: #4f46e5;
    background: #eef2ff;
}
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1.5px solid #e2e8f0;
    margin-top: 6px;
}
.btn-confirm {
    width: 100%;
    background: #2e7d32;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 10px;
    font-weight: 700;
    margin-top: 20px;
}
#qrBox {
    display: none;
    text-align: center;
    margin-top: 20px;
    background: #f8fafc;
    padding: 20px;
    border-radius: 12px;
}
.credit-note {
    display: none;
    margin-top: 15px;
    padding: 12px;
    background: #fef3c7;
    color: #92400e;
    border-radius: 10px;
    font-weight: 600;
}
</style>

<div class="payment-wrapper">

<!-- LEFT -->
<div class="card">
    <h2>Receive Payment</h2>

    <label>Customer</label>
    <input id="customer"
           value="{{ customer_name if customer_name else '' }}"
           placeholder="Enter customer name">

    <label style="margin-top:15px">Amount (₹)</label>
    <input id="amount"
           type="number"
           value="{{ total_amount if total_amount else '' }}"
           placeholder="Enter amount">

    <!-- Hidden transaction type -->
    <input type="hidden" id="txnType" value="SALE">

    <div class="payment-grid">
        <div class="pay-btn" onclick="selectMode('Cash', this)">💵 Cash</div>
        <div class="pay-btn" onclick="selectMode('UPI', this)">📱 UPI</div>
        <div class="pay-btn" onclick="selectMode('Card', this)">💳 Card</div>
        <div class="pay-btn" onclick="selectMode('Credit', this)">🤝 Credit</div>
    </div>

    <!-- CREDIT NOTE LABEL -->
    <div id="creditNoteLabel" class="credit-note">
        ⚠ This transaction will be saved as a Credit Note
    </div>

    <!-- ✅ STATIC REAL QR -->
    <div id="qrBox">
        <h4>Scan & Pay</h4>

        <img src="/static/images/avani-phonepe-qr.jpg"
             style="width:200px;border:1px solid #e5e7eb;border-radius:12px;">

        <p style="margin-top:10px;font-weight:600">
            ₹ <span id="qrAmount">0.00</span>
        </p>

        <small style="color:#64748b">
            PhonePe / GPay / Paytm
        </small>
    </div>
</div>

<!-- RIGHT -->
<div class="card" style="background:#1e293b;color:white">
    <h4 style="color:#94a3b8">Payment Summary</h4>

    <p><strong id="sCustomer">—</strong></p>

    <hr style="border-color:#334155">

    <h2 style="color:#fbbf24">
        ₹ <span id="sAmount">0.00</span>
    </h2>

    <p id="sTxnType" style="margin-top:10px;font-weight:700;color:#facc15"></p>

    <button class="btn-confirm" onclick="confirmPayment()">
        Confirm Payment & Print Receipt
    </button>
</div>

</div>

<script>
let mode = "";

function selectMode(m, el) {
    mode = m;

    document.querySelectorAll('.pay-btn')
        .forEach(b => b.classList.remove('active'));
    el.classList.add('active');

    if (m === "Credit") {
        document.getElementById("txnType").value = "CREDIT_NOTE";
        document.getElementById("creditNoteLabel").style.display = "block";
        document.getElementById("sTxnType").innerText = "CREDIT NOTE";
    } else {
        document.getElementById("txnType").value = "SALE";
        document.getElementById("creditNoteLabel").style.display = "none";
        document.getElementById("sTxnType").innerText = "";
    }

    updateSummary();

    if (m === "UPI") {
        showQR();
    } else {
        document.getElementById("qrBox").style.display = "none";
    }
}

function updateSummary() {
    const cust = document.getElementById("customer").value;
    const amt = document.getElementById("amount").value;

    document.getElementById("sCustomer").innerText = cust || "—";
    document.getElementById("sAmount").innerText = amt || "0.00";
}

function showQR() {
    const amt = document.getElementById("amount").value;
    if (!amt || amt <= 0) {
        alert("Enter amount first");
        return;
    }
    document.getElementById("qrAmount").innerText = amt;
    document.getElementById("qrBox").style.display = "block";
}

function confirmPayment() {
    const customer = document.getElementById("customer").value;
    const amount = document.getElementById("amount").value;

    if (!customer || !amount || !mode) {
        alert("Customer, amount and payment mode required");
        return;
    }

    window.location.href =
        `/generate-invoice?cust=${encodeURIComponent(customer)}&amt=${amount}&mode=${mode}&sale_id={{ sale_id }}`;
}

// Live update
document.getElementById("customer").addEventListener("input", updateSummary);
document.getElementById("amount").addEventListener("input", updateSummary);
</script>

{% endblock %}
